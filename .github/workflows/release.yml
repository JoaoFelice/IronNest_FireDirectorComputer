name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --name IronNestBallistics `
            --add-data "templates;templates" `
            --add-data "static;static" `
            app.py

      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\IronNestBallistics.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist\IronNestBallistics.exe.sha256 -Value "$hash  IronNestBallistics.exe" -Encoding ascii

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/IronNestBallistics.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/IronNestBallistics.exe
            dist/IronNestBallistics.exe.sha256
